name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          newest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$newest"
          xcodebuild -version
          xcodebuild -showsdks | grep -E "iphoneos|iOS" || true

      - name: Build app
        run: |
          set -o pipefail
          xcodebuild \
            -project DeepSeekGlass.xcodeproj \
            -scheme DeepSeekGlass \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/DeepSeekGlass.app"
          test -d "$APP"
          rm -rf Payload DeepSeekGlass-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry DeepSeekGlass-unsigned.ipa Payload
          ls -lh DeepSeekGlass-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: DeepSeekGlass-unsigned-ipa
          path: DeepSeekGlass-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
